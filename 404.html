<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found — KumTech Gateway</title>

    <style media="screen">
      *, *::before, *::after { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background:
          radial-gradient(circle at top, rgba(196, 195, 197, 0.28), transparent 34%),
          linear-gradient(135deg, #1c2553 0%, #1c2553 58%, #f17025 100%);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .logo {
        display: block;
        height: 48px;
        width: auto;
      }

      #message {
        background: rgba(255, 255, 255, 0.96);
        max-width: 420px;
        width: 100%;
        padding: 40px 32px 32px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
        backdrop-filter: blur(14px);
        text-align: center;
      }

      .badge {
        display: inline-block;
        color: #f17025;
        font-weight: 800;
        letter-spacing: 0.14em;
        font-size: 0.82rem;
        text-transform: uppercase;
        margin: 0 0 10px;
      }

      #message h1 {
        font-size: 1.9rem;
        line-height: 1.15;
        font-weight: 700;
        color: #1c2553;
        margin: 0 0 14px;
      }

      #message p {
        line-height: 1.6;
        margin: 0 0 24px;
        font-size: 0.95rem;
        color: rgba(15, 23, 42, 0.72);
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 20px;
        border-radius: 999px;
        background: linear-gradient(135deg, #1c2553, #f17025);
        color: white;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 16px 32px rgba(28, 37, 83, 0.28);
        transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
        margin-bottom: 16px;
      }

      .btn-primary:hover,
      .btn-primary:focus-visible {
        opacity: 0.88;
        box-shadow: 0 20px 40px rgba(28, 37, 83, 0.36);
        transform: translateY(-1px);
        outline: none;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 20px;
        margin-top: 8px;
      }

      .nav-links a {
        font-size: 0.83rem;
        font-weight: 600;
        color: #1c2553;
        text-decoration: none;
        opacity: 0.7;
        transition: opacity 0.2s;
      }

      .nav-links a:hover {
        opacity: 1;
      }

      @media (max-width: 600px) {
        body { padding: 16px; }
        #message {
          padding: 32px 24px 24px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <img src="/images/site/logo.png" alt="KumTech Gateway" class="logo">

    <div id="message">
      <p class="badge">404</p>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or may have been moved. Double-check the URL or head back to a working page.</p>
      <a href="/" class="btn-primary">Back to Home</a>
      <nav class="nav-links" aria-label="Helpful links">
        <a href="/services.html">Services</a>
        <a href="/portfolio.html">Portfolio</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </body>
</html>
